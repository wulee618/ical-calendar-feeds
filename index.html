<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>iCal Calendar Feeds</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  ul { padding-left: 1.2rem; }
  li { margin: 0.5rem 0; }
  code { background: #f2f2f2; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; word-break: break-all; }
  button { font-size: 0.8em; margin-left: 0.4rem; cursor: pointer; }
  #empty { color: #666; }
</style>
</head>
<body>
<h1>iCal Calendar Feeds</h1>
<p>可直接複製下方連結，貼到 epaper 專案的 iCal 日曆來源設定中。</p>
<ul id="list"></ul>
<p id="empty" style="display:none;">目前還沒有任何 .ics 檔案，請用 <code>add_calendar.sh</code> 上傳。</p>

<script>
fetch('manifest.json')
  .then(r => r.json())
  .then(files => {
    const list = document.getElementById('list');
    if (!files.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    const base = new URL('calendars/', location.href).href;
    files.forEach(name => {
      const url = base + encodeURIComponent(name);
      const li = document.createElement('li');
      li.innerHTML = `${name}<br><code>${url}</code> <button onclick="navigator.clipboard.writeText('${url}')">複製</button>`;
      list.appendChild(li);
    });
  });
</script>
</body>
</html>
